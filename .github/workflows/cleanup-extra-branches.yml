name: Cleanup extra branches
on:
  push:
    branches: [preview]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0
      - name: Delete extra branches
        run: |
          git push origin --delete temp-assistant-dashboard-polish temp-reorder-first-pages
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/cleanup-extra-branches.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/cleanup-extra-branches.yml
          git commit -m 'Remove temporary branch cleanup workflow'
          git push origin preview
