name: Temp format reorder
on:
  pull_request:
    branches: [preview]
permissions:
  contents: write
jobs:
  format:
    if: github.head_ref == 'temp-reorder-first-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Normalize reordered blocks
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent, indent

          def formatted(value, spaces):
              return indent(dedent(value).strip(), ' ' * spaces)

          def line_start(text, index):
              newline = text.rfind('\n', 0, index)
              return 0 if newline < 0 else newline + 1

          def section_to_section(path, start_component, end_component, replacement, spaces=24):
              p = Path(path)
              text = p.read_text()
              first = text.index(f'<{start_component}')
              start_tag = text.rfind('<section', 0, first)
              start = line_start(text, start_tag)
              last = text.index(f'<{end_component}', first)
              end = text.index('</section>', last) + len('</section>')
              p.write_text(text[:start] + formatted(replacement, spaces) + text[end:])

          def section_to_selfclosing(path, start_component, end_component, replacement, spaces=24):
              p = Path(path)
              text = p.read_text()
              first = text.index(f'<{start_component}')
              start_tag = text.rfind('<section', 0, first)
              start = line_start(text, start_tag)
              last = text.index(f'<{end_component}', first)
              end = text.index('/>', last) + 2
              p.write_text(text[:start] + formatted(replacement, spaces) + text[end:])

          section_to_section('app/page.tsx', 'DailyEvolutionCard', 'UnitWordCorrelationCard', '''
          <section className="mb-6 min-w-0 max-w-full">
              <DailyEvolutionCard data={data} />
          </section>

          <section className="mb-6 grid grid-cols-1 gap-5 xl:grid-cols-2">
              <ConversationGoalsCard data={data} />
              <DropoffCard data={data} />
          </section>

          <section className="mb-6 grid grid-cols-1 gap-5 xl:grid-cols-2">
              <ScheduleEvolutionCard data={data} />
              <ScheduleCreationEvolutionCard data={data} />
          </section>

          <section className="mb-6 min-w-0 max-w-full">
              <ExecutiveScheduleTable
                  data={data.schedule_unit_table}
              />
          </section>

          <section className="mb-6 grid min-w-0 max-w-full grid-cols-1 gap-5 2xl:grid-cols-[1.35fr_1fr]">
              <UnitEfficiencyMapCard data={data} />
              <UnitViewCard data={data} />
          </section>

          <section className="grid min-w-0 max-w-full grid-cols-1 gap-5 xl:grid-cols-2">
              <WordMapCard
                  data={data}
                  loading={wordMapLoading}
              />
              <UnitWordCorrelationCard
                  data={data}
                  loading={wordMapLoading}
              />
          </section>
          ''')

          section_to_selfclosing('app/financeiro/page.tsx', 'ProcedureMixByCityCard', 'AdsSection', '''
          <section className="mb-6">
              <ProcedureMixByCityCard
                  data={financialSummary.data}
                  loading={financialSummary.loading}
                  error={financialSummary.error}
              />
          </section>

          <section className="mb-6 min-w-0 max-w-full">
              <FinancialUnitTableCard
                  data={financialSummary.data}
                  operationalUnits={data.by_unit}
                  operationalKpis={data.kpis}
                  loading={financialSummary.loading}
                  error={financialSummary.error}
              />
          </section>

          <section className="mb-6 grid grid-cols-1 items-start gap-5 xl:grid-cols-2">
              <CrmCard data={data} />
              <DoctorCard data={data} />
          </section>

          <AdsSection data={data} />
          ''')

          section_to_selfclosing('app/financeiro/page.tsx', 'AdsEvolutionCard', 'AdsCampaignCard', '''
          <section className="mb-5">
              <AdsEvolutionCard data={data} />
          </section>

          <div className="mb-5">
              <AdsPlatformRoasCard data={data} />
          </div>

          <div className="mb-5">
              <AdsPlatformCard data={data} />
          </div>

          <div className="mb-5">
              <PaidCityReturnCard data={data} />
          </div>

          <div className="mb-5">
              <MediaBudgetByCityCard data={data} />
          </div>

          <AdsCampaignCard data={data} />
          ''', spaces=20)

          section_to_section('app/jornada/page.tsx', 'FullJourneyPipelineCard', 'ObjectionsCard', '''
          <section className="mb-6 min-w-0 max-w-full">
              <FullJourneyPipelineCard
                  data={current}
                  onSelectRecommendedMonth={() => {
                      setPeriod(null);
                      setSelectedRange(
                          getRecommendedMatureMonthRange(),
                      );
                  }}
              />
          </section>

          <section className="mb-6 grid min-w-0 max-w-full grid-cols-1 gap-5 xl:grid-cols-[0.9fr_1.1fr]">
              <WhatsappCoverageCard
                  pipeline={current.full_pipeline}
              />
              <TrackedWhatsappSourcesCard
                  pipeline={current.full_pipeline}
              />
          </section>

          <section className="mb-6 grid grid-cols-1 gap-5 xl:grid-cols-[1.7fr_0.8fr]">
              <JourneyFunnelCard data={current} />
              <DropoffCard data={current} />
          </section>

          <section className="grid grid-cols-1 gap-5 xl:grid-cols-[1.5fr_0.9fr]">
              <IntentPathsCard data={current} />
              <ObjectionsCard data={current} />
          </section>
          ''')
          PY
      - name: Validate TypeScript
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
      - name: Commit formatted source
        run: |
          rm -f .github/workflows/temp-format-reorder.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/financeiro/page.tsx app/jornada/page.tsx .github/workflows/temp-format-reorder.yml
          git commit -m 'Normalize dashboard reorder formatting'
          git push origin HEAD:${{ github.head_ref }}