name: Temp exact mobile sidebar fix
on:
  push:
    branches: [preview]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'Prepare exact mobile sidebar fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply exact fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/globals.css')
          s = p.read_text()
          old = '''    aside.group.fixed.left-0.top-14 {\n        transition-property: transform !important;\n        transition-duration: 300ms !important;\n        transition-timing-function: ease-out !important;\n        will-change: transform;\n    }\n\n    aside.group.fixed.left-0.top-14 button.border {\n        border-color: transparent !important;\n    }\n'''
          new = '''    aside.group.fixed.left-0.top-14 {\n        transition-property: translate !important;\n        transition-duration: 300ms !important;\n        transition-timing-function: ease-out !important;\n        will-change: translate;\n    }\n'''
          if old not in s:
              raise SystemExit('globals anchor missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('components/layout/SidePanel.tsx')
          s = p.read_text()
          s = s.replace('isExpanded ? "md:border-border" : "md:border-transparent"', 'isExpanded ? "border-border" : "border-transparent"')
          if s.count('isExpanded ? "border-border" : "border-transparent"') < 2:
              raise SystemExit('sidebar border anchors missing')
          p.write_text(s)
          PY
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-fix-sidebar-mobile.yml
          git add app/globals.css components/layout/SidePanel.tsx
          git commit -m 'Fix mobile sidebar animation and preserve borders'
          git push origin preview