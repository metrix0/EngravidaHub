name: Temporary Conversas and funnel polish runner

on:
  push:
    branches:
      - preview

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Apply exact UI patches
        shell: bash
        run: |
          git pull --ff-only origin preview

          python - <<'PY'
          from pathlib import Path

          # Conversas page: make standalone client identity open permanent profile.
          path = Path('app/conversas/page.tsx')
          text = path.read_text()

          anchor = 'import { ConversationPanel } from "@/components/conversations/ConversationPanel";\n'
          import_line = 'import { openClientProfile } from "@/components/clientes/PermanentClientProfilePanel";\n'
          if import_line not in text:
              if text.count(anchor) != 1:
                  raise SystemExit(f'Conversas import anchor count: {text.count(anchor)}')
              text = text.replace(anchor, anchor + import_line, 1)

          type_anchor = '    id: string;\n    item_type: "conversation" | "thread";\n'
          type_replacement = '    id: string;\n    client_id: string | null;\n    item_type: "conversation" | "thread";\n'
          if '    client_id: string | null;\n    item_type:' not in text:
              if text.count(type_anchor) != 1:
                  raise SystemExit(f'Conversas row type anchor count: {text.count(type_anchor)}')
              text = text.replace(type_anchor, type_replacement, 1)

          old_render = '''        render: (conversation) => (\n            <div className="flex min-w-0 items-center gap-3">\n                <InitialsAvatar\n                    name={conversation.client_name}\n                    conversationState={\n                        conversation.item_type === "thread"\n                            ? "live"\n                            : undefined\n                    }\n                />\n                <span title={conversation.client_name} className="truncate font-medium text-slate-700">\n                    {conversation.client_name}\n                </span>\n            </div>\n        ),'''
          new_render = '''        render: (conversation) => {\n            const identity = (\n                <>\n                    <InitialsAvatar\n                        name={conversation.client_name}\n                        conversationState={\n                            conversation.item_type === "thread"\n                                ? "live"\n                                : undefined\n                        }\n                    />\n                    <span\n                        title={conversation.client_name}\n                        className="truncate font-medium text-slate-700 transition-colors group-hover/client:text-brand"\n                    >\n                        {conversation.client_name}\n                    </span>\n                </>\n            );\n\n            if (!conversation.client_id) {\n                return (\n                    <div className="flex min-w-0 items-center gap-3">\n                        {identity}\n                    </div>\n                );\n            }\n\n            return (\n                <button\n                    type="button"\n                    onClick={(event) => {\n                        event.stopPropagation();\n                        openClientProfile(conversation.client_id!);\n                    }}\n                    title={`Abrir perfil de ${conversation.client_name}`}\n                    className="group/client -m-1 flex min-w-0 cursor-pointer items-center gap-3 rounded-lg p-1 text-left transition-colors hover:bg-slate-50"\n                >\n                    {identity}\n                </button>\n            );\n        },'''
          if new_render not in text:
              if text.count(old_render) != 1:
                  raise SystemExit(f'Conversas client render anchor count: {text.count(old_render)}')
              text = text.replace(old_render, new_render, 1)

          path.write_text(text)

          # Existing Conversas API: retain client_id in its current response.
          path = Path('app/api/dashboard/conversas/route.ts')
          text = path.read_text()

          internal_anchor = '    id: string;\n    item_type: "conversation" | "thread";\n'
          internal_replacement = '    id: string;\n    client_id: string | null;\n    item_type: "conversation" | "thread";\n'
          marker = 'type InternalConversationRow = {'
          before, after = text.split(marker, 1)
          if '    client_id: string | null;\n    item_type:' not in after.split('};', 1)[0]:
              if after.count(internal_anchor) < 1:
                  raise SystemExit('InternalConversationRow anchor not found')
              after = after.replace(internal_anchor, internal_replacement, 1)
              text = before + marker + after

          conv_anchor = '''                return {\n                    id: conversation.id,\n                    item_type: "conversation" as const,'''
          conv_replacement = '''                return {\n                    id: conversation.id,\n                    client_id: conversation.client_id,\n                    item_type: "conversation" as const,'''
          if '                    client_id: conversation.client_id,\n                    item_type:' not in text:
              if text.count(conv_anchor) != 1:
                  raise SystemExit(f'Conversation mapping anchor count: {text.count(conv_anchor)}')
              text = text.replace(conv_anchor, conv_replacement, 1)

          thread_anchor = '''                return {\n                    id: thread.id,\n                    item_type: "thread" as const,'''
          thread_replacement = '''                return {\n                    id: thread.id,\n                    client_id: thread.client_id,\n                    item_type: "thread" as const,'''
          if '                    client_id: thread.client_id,\n                    item_type:' not in text:
              if text.count(thread_anchor) != 1:
                  raise SystemExit(f'Thread mapping anchor count: {text.count(thread_anchor)}')
              text = text.replace(thread_anchor, thread_replacement, 1)

          path.write_text(text)

          # Funnel: keep current width on normal screens, widen only 2xl displays.
          path = Path('app/funil/page.tsx')
          text = path.read_text()
          old = 'min-h-[560px] w-[260px] shrink-0 rounded-xl border border-border bg-slate-50 p-3'
          new = 'min-h-[560px] w-[260px] 2xl:w-[290px] shrink-0 rounded-xl border border-border bg-slate-50 p-3'
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'Expected 3 funnel column width anchors, got {count}')
          text = text.replace(old, new)
          path.write_text(text)
          PY

          git diff --check
          git diff -- app/conversas/page.tsx app/api/dashboard/conversas/route.ts app/funil/page.tsx

          git rm .github/workflows/temp-conversas-funnel-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/conversas/page.tsx app/api/dashboard/conversas/route.ts app/funil/page.tsx
          git commit -m "Polish Conversas client links and funnel width"
          git push origin HEAD:preview
