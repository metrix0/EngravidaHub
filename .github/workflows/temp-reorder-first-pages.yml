name: Temp reorder first pages
on:
  pull_request:
    branches: [preview]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'temp-reorder-first-pages'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Reorder dashboard content
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          dashboard_old = '''                        <section className="mb-6 grid grid-cols-1 gap-5 md:grid-cols-[1.45fr_0.95fr]">
                            <DailyEvolutionCard data={data} />
                            <DropoffCard data={data} />
                        </section>

                        <section className="mb-6 grid grid-cols-1 gap-5">
                            <ScheduleEvolutionCard data={data} />
                            <ScheduleCreationEvolutionCard data={data} />
                        </section>

                        <section className="mb-6 grid grid-cols-1 gap-5 md:grid-cols-2">
                            <ConversationGoalsCard data={data} />
                            <UnitViewCard data={data} />
                        </section>

                        <section className="min-w-0 max-w-full">
                            <ExecutiveScheduleTable
                                data={data.schedule_unit_table}
                            />
                        </section>

                        <section className="mt-6 min-w-0 max-w-full">
                            <UnitEfficiencyMapCard data={data} />
                        </section>

                        <section className="mt-6 grid min-w-0 max-w-full grid-cols-1 gap-5 xl:grid-cols-2">
                            <WordMapCard
                                data={data}
                                loading={wordMapLoading}
                            />
                            <UnitWordCorrelationCard
                                data={data}
                                loading={wordMapLoading}
                            />
                        </section>'''
          dashboard_new = '''                        <section className="mb-6 min-w-0 max-w-full">
                            <DailyEvolutionCard data={data} />
                        </section>

                        <section className="mb-6 grid grid-cols-1 gap-5 xl:grid-cols-2">
                            <ConversationGoalsCard data={data} />
                            <DropoffCard data={data} />
                        </section>

                        <section className="mb-6 grid grid-cols-1 gap-5 xl:grid-cols-2">
                            <ScheduleEvolutionCard data={data} />
                            <ScheduleCreationEvolutionCard data={data} />
                        </section>

                        <section className="mb-6 min-w-0 max-w-full">
                            <ExecutiveScheduleTable
                                data={data.schedule_unit_table}
                            />
                        </section>

                        <section className="mb-6 grid min-w-0 max-w-full grid-cols-1 gap-5 2xl:grid-cols-[1.35fr_1fr]">
                            <UnitEfficiencyMapCard data={data} />
                            <UnitViewCard data={data} />
                        </section>

                        <section className="grid min-w-0 max-w-full grid-cols-1 gap-5 xl:grid-cols-2">
                            <WordMapCard
                                data={data}
                                loading={wordMapLoading}
                            />
                            <UnitWordCorrelationCard
                                data={data}
                                loading={wordMapLoading}
                            />
                        </section>'''
          replace_once('app/page.tsx', dashboard_old, dashboard_new)

          finance_old = '''                        <section className="mb-6 min-w-0 max-w-full">
                            <FinancialUnitTableCard
                                data={financialSummary.data}
                                operationalUnits={data.by_unit}
                                operationalKpis={data.kpis}
                                loading={financialSummary.loading}
                                error={financialSummary.error}
                            />
                        </section>

                        <section className="mb-6">
                            <ProcedureMixByCityCard
                                data={financialSummary.data}
                                loading={financialSummary.loading}
                                error={financialSummary.error}
                            />
                        </section>

                        <section className="mb-6 grid grid-cols-1 items-start gap-5 xl:grid-cols-2">
                            <CrmCard data={data} />
                            <DoctorCard data={data} />
                        </section>

                        <AdsSection data={data} />

                        <section className="mt-6 min-w-0 max-w-full">
                            <MediaBudgetByCityCard data={data} />
                        </section>

                        <section className="mt-6 min-w-0 max-w-full">
                            <PaidCityReturnCard data={data} />
                        </section>'''
          finance_new = '''                        <section className="mb-6">
                            <ProcedureMixByCityCard
                                data={financialSummary.data}
                                loading={financialSummary.loading}
                                error={financialSummary.error}
                            />
                        </section>

                        <section className="mb-6 min-w-0 max-w-full">
                            <FinancialUnitTableCard
                                data={financialSummary.data}
                                operationalUnits={data.by_unit}
                                operationalKpis={data.kpis}
                                loading={financialSummary.loading}
                                error={financialSummary.error}
                            />
                        </section>

                        <section className="mb-6 grid grid-cols-1 items-start gap-5 xl:grid-cols-2">
                            <CrmCard data={data} />
                            <DoctorCard data={data} />
                        </section>

                        <AdsSection data={data} />'''
          replace_once('app/financeiro/page.tsx', finance_old, finance_new)

          ads_old = '''                    <section className="mb-5">
                        <AdsEvolutionCard data={data} />
                    </section>

                    <div className="mb-5">
                        <AdsPlatformCard data={data} />
                    </div>

                    <div className="mb-5">
                        <AdsPlatformRoasCard data={data} />
                    </div>

                    <AdsCampaignCard data={data} />'''
          ads_new = '''                    <section className="mb-5">
                        <AdsEvolutionCard data={data} />
                    </section>

                    <div className="mb-5">
                        <AdsPlatformRoasCard data={data} />
                    </div>

                    <div className="mb-5">
                        <AdsPlatformCard data={data} />
                    </div>

                    <div className="mb-5">
                        <PaidCityReturnCard data={data} />
                    </div>

                    <div className="mb-5">
                        <MediaBudgetByCityCard data={data} />
                    </div>

                    <AdsCampaignCard data={data} />'''
          replace_once('app/financeiro/page.tsx', ads_old, ads_new)

          journey_old = '''                        <section className="mb-6 grid grid-cols-1 gap-5 md:grid-cols-[1.7fr_0.8fr]">
                            <JourneyFunnelCard data={current} />
                            <DropoffCard data={current} />
                        </section>
                        <section className="grid grid-cols-1 gap-5 md:grid-cols-[1.5fr_0.9fr]">
                            <IntentPathsCard data={current} />
                            <ObjectionsCard data={current} />
                        </section>
                        <section className="mt-6 min-w-0 max-w-full">
                            <FullJourneyPipelineCard
                                data={current}
                                onSelectRecommendedMonth={() => {
                                    setPeriod(null);
                                    setSelectedRange(
                                        getRecommendedMatureMonthRange(),
                                    );
                                }}
                            />
                        </section>
                        <section className="mt-6 min-w-0 max-w-full">
                            <WhatsappCoverageCard
                                pipeline={current.full_pipeline}
                            />
                        </section>
                        <section className="mt-6 min-w-0 max-w-full">
                            <TrackedWhatsappSourcesCard
                                pipeline={current.full_pipeline}
                            />
                        </section>'''
          journey_new = '''                        <section className="mb-6 min-w-0 max-w-full">
                            <FullJourneyPipelineCard
                                data={current}
                                onSelectRecommendedMonth={() => {
                                    setPeriod(null);
                                    setSelectedRange(
                                        getRecommendedMatureMonthRange(),
                                    );
                                }}
                            />
                        </section>

                        <section className="mb-6 grid min-w-0 max-w-full grid-cols-1 gap-5 xl:grid-cols-[0.9fr_1.1fr]">
                            <WhatsappCoverageCard
                                pipeline={current.full_pipeline}
                            />
                            <TrackedWhatsappSourcesCard
                                pipeline={current.full_pipeline}
                            />
                        </section>

                        <section className="mb-6 grid grid-cols-1 gap-5 xl:grid-cols-[1.7fr_0.8fr]">
                            <JourneyFunnelCard data={current} />
                            <DropoffCard data={current} />
                        </section>

                        <section className="grid grid-cols-1 gap-5 xl:grid-cols-[1.5fr_0.9fr]">
                            <IntentPathsCard data={current} />
                            <ObjectionsCard data={current} />
                        </section>'''
          replace_once('app/jornada/page.tsx', journey_old, journey_new)
          PY
      - name: Validate TypeScript
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
      - name: Commit source-only result
        run: |
          rm -f .github/workflows/temp-reorder-first-pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/financeiro/page.tsx app/jornada/page.tsx .github/workflows/temp-reorder-first-pages.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Reorder first dashboard pages by information flow'
          git push origin HEAD:${{ github.head_ref }}