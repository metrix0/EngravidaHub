name: Temporary client profile panel patch runner

on:
  push:
    branches:
      - preview

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
          fetch-depth: 0

      - name: Apply exact client profile patches
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          floating_path = Path('components/conversations/FloatingConversationPanel.tsx')
          floating = floating_path.read_text()

          import_line = 'import { openClientProfile } from "@/components/clientes/PermanentClientProfilePanel";\n'
          if import_line not in floating:
              anchor = 'import { useCurrentUser } from "@/components/auth/CurrentUserProvider";\n'
              if floating.count(anchor) != 1:
                  raise SystemExit(f'Floating import anchor count: {floating.count(anchor)}')
              floating = floating.replace(anchor, anchor + import_line, 1)

          pattern = re.compile(
              r'onOpenClientProfile=\{\(clientId\) =>\s*'
              r'router\.push\(`/clientes\?client_id=\$\{encodeURIComponent\(clientId\)\}`\)\s*'
              r'\}'
          )
          floating, callback_count = pattern.subn(
              'onOpenClientProfile={openClientProfile}',
              floating,
              count=1,
          )
          if callback_count != 1:
              raise SystemExit(f'Floating profile callback replacements: {callback_count}')

          floating_path.write_text(floating)

          funnel_path = Path('app/funil/page.tsx')
          funnel = funnel_path.read_text()
          marker = 'const SelectableClientRow = memo(function SelectableClientRow'
          if funnel.count(marker) != 1:
              raise SystemExit(f'SelectableClientRow marker count: {funnel.count(marker)}')

          before, after = funnel.split(marker, 1)
          identity = '''<div className="flex min-w-0 items-center gap-3">
                    <InitialsAvatar name={client.name ?? "Cliente"} />'''
          replacement = '''<div
                    role="button"
                    tabIndex={0}
                    onClick={() => openClientProfile(client.id)}
                    onKeyDown={(event) => {
                        if (event.key === "Enter" || event.key === " ") {
                            event.preventDefault();
                            openClientProfile(client.id);
                        }
                    }}
                    title={`Abrir perfil de ${client.name ?? "cliente"}`}
                    className="flex min-w-0 cursor-pointer items-center gap-3 transition-opacity hover:opacity-80"
                >
                    <InitialsAvatar name={client.name ?? "Cliente"} />'''
          if after.count(identity) != 1:
              raise SystemExit(f'Add-client identity count: {after.count(identity)}')
          after = after.replace(identity, replacement, 1)
          funnel_path.write_text(before + marker + after)
          PY

          git diff --check
          git diff -- components/conversations/FloatingConversationPanel.tsx app/funil/page.tsx

      - name: Commit exact patches
        shell: bash
        run: |
          if git diff --quiet -- components/conversations/FloatingConversationPanel.tsx app/funil/page.tsx; then
            echo "No source changes to commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/conversations/FloatingConversationPanel.tsx app/funil/page.tsx
          git commit -m "Finish permanent client profile entry points"
          git push origin HEAD:preview
