name: Temp direct dashboard fixes
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview
      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply requested fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one `{old[:70]}` match, found {count}")
              p.write_text(text.replace(old, new, 1))

          def swap_component_sections(path, first_component, second_component):
              p = Path(path)
              text = p.read_text()
              first_at = text.index(f'<{first_component}')
              second_at = text.index(f'<{second_component}')
              if first_at > second_at:
                  return
              first_start = text.rfind('<section', 0, first_at)
              first_start = text.rfind('\n', 0, first_start) + 1
              first_end = text.index('</section>', first_at) + len('</section>')
              second_start = text.rfind('<section', first_end, second_at)
              second_start = text.rfind('\n', 0, second_start) + 1
              second_end = text.index('</section>', second_at) + len('</section>')
              between = text[first_end:second_start]
              first_block = text[first_start:first_end]
              second_block = text[second_start:second_end]
              p.write_text(text[:first_start] + second_block + between + first_block + text[second_end:])

          # Dashboard unit table: use the already-available unique appointment metric.
          replace_once('app/page.tsx', '<div>Agendamentos</div>', '<div>Agendamentos únicos</div>')
          replace_once(
              'app/page.tsx',
              'title="Agendamentos importados da agenda do CliniSys"',
              'title="Clientes únicos com agendamento no CliniSys; registros repetidos e reagendamentos do mesmo paciente não aumentam a contagem."',
          )
          replace_once(
              'app/page.tsx',
              'unit.appointments_count.toLocaleString("pt-BR")',
              'unit.unique_appointments_count.toLocaleString("pt-BR")',
          )

          # Financeiro: Faturamento por unidade before Procedimentos por cidade.
          swap_component_sections('app/financeiro/page.tsx', 'ProcedureMixByCityCard', 'FinancialUnitTableCard')

          # Paid media: Eficiência por plataforma before ROAS por Plataforma.
          p = Path('app/financeiro/page.tsx')
          text = p.read_text()
          pattern = re.compile(
              r'(\s*<div className="mb-5">\s*<AdsPlatformRoasCard data=\{data\} />\s*</div>)(\s*<div className="mb-5">\s*<AdsPlatformCard data=\{data\} />\s*</div>)'
          )
          match = pattern.search(text)
          if not match:
              raise SystemExit('app/financeiro/page.tsx: platform card pair not found')
          text = text[:match.start()] + match.group(2) + match.group(1) + text[match.end():]
          p.write_text(text)

          # Jornada: these two large WhatsApp cards need the full row to avoid internal overflow.
          p = Path('app/jornada/page.tsx')
          text = p.read_text()
          whatsapp_at = text.index('<WhatsappCoverageCard')
          tracked_at = text.index('<TrackedWhatsappSourcesCard', whatsapp_at)
          start_tag = text.rfind('<section', 0, whatsapp_at)
          start = text.rfind('\n', 0, start_tag) + 1
          end = text.index('</section>', tracked_at) + len('</section>')
          indent = ' ' * 24
          replacement = f'''{indent}<section className="mb-6 min-w-0 max-w-full">\n{indent}    <WhatsappCoverageCard\n{indent}        pipeline={{current.full_pipeline}}\n{indent}    />\n{indent}</section>\n\n{indent}<section className="mb-6 min-w-0 max-w-full">\n{indent}    <TrackedWhatsappSourcesCard\n{indent}        pipeline={{current.full_pipeline}}\n{indent}    />\n{indent}</section>'''
          p.write_text(text[:start] + replacement + text[end:])

          # Instagram participation is a volume comparison, not cross-channel tracking.
          replace_once(
              'components/dashboard/InstagramConversationInsights.tsx',
              'description="Percentual diário entre Instagram e WhatsApp. Quanto maior o valor de Participação, maior a conversão entre Instagram e Whatsapp"',
              'description="Comparação do volume de conversas entre Instagram e WhatsApp."',
          )
          p = Path('components/dashboard/InstagramConversationInsights.tsx')
          text = p.read_text()
          anchor = '''            <InsightHeader\n                title="Participação do Instagram nas conversas"\n                description="Comparação do volume de conversas entre Instagram e WhatsApp."\n            />'''
          if text.count(anchor) != 1:
              raise SystemExit('Instagram share header anchor not found exactly once')
          info = '''\n\n            <div className="mt-3 inline-flex max-w-full rounded-lg bg-slate-50 px-3 py-2 text-xs leading-5 text-slate-500">\n                Informação: este indicador compara apenas o volume de conversas entre os canais. Não rastreia se uma conversa do Instagram virou uma conversa no WhatsApp.\n            </div>'''
          p.write_text(text.replace(anchor, anchor + info, 1))
          PY
      - name: Validate TypeScript
        run: |
          pnpm install --frozen-lockfile
          pnpm exec tsc --noEmit
      - name: Commit source-only result
        run: |
          rm -f .github/workflows/temp-direct-dashboard-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/page.tsx app/financeiro/page.tsx app/jornada/page.tsx components/dashboard/InstagramConversationInsights.tsx .github/workflows/temp-direct-dashboard-fixes.yml
          git commit -m 'Fix dashboard metrics and card layout'
          git push origin HEAD:preview
